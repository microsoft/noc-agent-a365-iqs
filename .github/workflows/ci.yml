name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  spa-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/app/admin-ui/spa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/app/admin-ui/spa/package-lock.json
      - run: npm ci
      - run: npm run build

  run-ledger-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/app/run-ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: gateway/app/run-ledger/requirements.txt
      - run: pip install -r requirements.txt
      # ponytail: `python -m pytest` (not bare `pytest`) puts CWD on sys.path so `run_ledger` imports
      - run: python -m pytest tests -v

# ponytail: covers only the two suites proven green locally (spa `tsc -b && vite build`,
# run-ledger's 28 tests). admin-ui/bff and config-sync-worker have tests/ dirs but no
# pytest pinned in their requirements -- add jobs for them once those are known to pass.
