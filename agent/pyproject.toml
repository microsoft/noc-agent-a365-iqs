[project]
name = "noc-agent-a365"
version = "0.1.0"
description = "NOC/NOA network operations assistant -- a Microsoft Agent Framework (MAF) agent with Foundry IQ, Fabric IQ, Web IQ, and Work IQ tools, hosted on Agent 365 for Teams / M365 Copilot"
authors = [
    { name = "Microsoft", email = "support@microsoft.com" }
]
dependencies = [
    # Microsoft Agent Framework (MAF) -- runs in-process, not via a pre-built Foundry agent
    "agent-framework-core>=1.13,<2",
    "agent-framework-foundry>=1.10.0",
    "agent-framework-foundry-hosting>=1.0.0a260630",
    "agent-framework-hosting==1.0.0a260730",
    "agent-framework-hosting-mcp==1.0.0a260730",
    "mcp>=1.27,<2",
    "starlette>=0.40",
    "uvicorn>=0.30",

    # Foundry project connection-id resolution for the 4 native IQ tools
    "azure-ai-projects>=2.3.0",

    # Microsoft Agents SDK -- A365 hosting layer
    "microsoft-agents-hosting-aiohttp",
    "microsoft-agents-hosting-core",
    "microsoft-agents-authentication-msal",
    "microsoft-agents-activity",

    # Azure SDK
    "azure-identity>=1.25.3",
    "azure-monitor-opentelemetry>=1.8.7",
    "httpx>=0.28.1",

    # Core
    "python-dotenv",
    "aiohttp",
    "PyJWT>=2.8.0",

    # Microsoft Agent 365 SDK packages
    "microsoft_agents_a365_tooling >= 0.1.0",
    "microsoft_agents_a365_tooling_extensions_agentframework >= 0.1.0",
    "microsoft_agents_a365_observability_core >= 0.1.0",
    "microsoft_agents_a365_observability_extensions_agent_framework >= 0.1.0",
    "microsoft_agents_a365_runtime >= 0.1.0",
    "microsoft_agents_a365_notifications >= 0.1.0",
]
requires-python = ">=3.11"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
